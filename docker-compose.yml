services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paytail
      POSTGRES_PASSWORD: paytail
      POSTGRES_DB: paytail
    ports:
      - "5432:5432"
    volumes:
      - paytail-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paytail -d paytail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paytail-db:
